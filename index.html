<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シェアハウス上映会 スタンプラリー</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .stamp-slot { aspect-ratio: 1; border: 2px dashed #475569; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: all 0.3s ease; }
    .stamp-slot.active { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
    .stamp-mark { font-size: 2.5rem; color: #f59e0b; transform: rotate(-12deg) scale(0); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popIn { to { transform: rotate(-12deg) scale(1); } }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- ヘッダー / ユーザー情報 -->
  <header class="p-4 max-w-md mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-3 glass px-4 py-2 rounded-full">
      <div id="userAvatar" class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-sm font-bold">
        <i class="fas fa-user"></i>
      </div>
      <span id="userName" class="text-sm font-medium">ゲストさん</span>
    </div>
    <button onclick="toggleAdminModal()" class="text-xs text-amber-400 hover:text-amber-300 font-semibold px-3 py-1.5 rounded-lg border border-amber-400/30">
      編集者画面 🔑
    </button>
  </header>

  <!-- タイトルカード -->
  <main class="max-w-md mx-auto px-4 space-y-6">
    <div class="glass p-6 rounded-2xl text-center space-y-2 relative overflow-hidden">
      <div class="absolute -right-6 -top-6 w-24 h-24 bg-amber-500/10 rounded-full blur-xl"></div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">
        🎬 ディズニー映画会 スタンプラリー
      </h1>
      <p class="text-xs text-slate-400">全4回参加でピザ＆スイーツ100円引き券！</p>
    </div>

    <!-- スタンプカード -->
    <div class="glass p-5 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <i class="fas fa-stamp text-amber-400"></i> スタンプカード
        </h2>
        <span id="stampCount" class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full font-bold">0 / 4</span>
      </div>

      <div class="grid grid-cols-2 gap-3" id="stampGrid">
        <!-- JSで動的生成 -->
      </div>
    </div>

    <!-- 上映イベント一覧 -->
    <div class="space-y-3">
      <h2 class="text-sm font-bold text-slate-300 px-1 flex items-center gap-2">
        <i class="fas fa-calendar-alt text-indigo-400"></i> 上映スケジュール ＆ 予約
      </h2>

      <div id="eventList" class="space-y-3">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </main>

  <!-- モーダル：事前予約 -->
  <div id="bookingModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass max-w-xs w-full p-5 rounded-2xl space-y-4 text-center">
      <h3 id="bookingTitle" class="font-bold text-base text-slate-100"></h3>
      <div id="currentBookingNotice" class="text-xs text-amber-300 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 hidden"></div>
      
      <!-- 日程選択リスト -->
      <div id="dateOptions" class="space-y-2 text-left">
        <!-- 日程ボタンが動的に挿入されます -->
      </div>

      <!-- 操作ボタン -->
      <div class="space-y-2 pt-2 border-t border-slate-700/50">
        <button id="confirmBookingBtn" onclick="submitBooking()" disabled class="w-full py-2.5 bg-slate-700 text-slate-500 font-bold rounded-xl text-xs transition cursor-not-allowed">
          日程を選択してください
        </button>
        <button onclick="closeModal('bookingModal')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-xs">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- モーダル：スタンプ押印（クイズ回答） -->
  <div id="stampModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass max-w-xs w-full p-5 rounded-2xl space-y-4">
      <h3 class="font-bold text-base text-slate-100 text-center">出席スタンプを押す</h3>
      <p id="quizQuestion" class="text-xs text-amber-300 bg-amber-500/10 p-3 rounded-xl border border-amber-500/20"></p>
      <input type="text" id="quizAnswer" placeholder="答えを入力" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
      <div class="flex gap-2">
        <button onclick="closeModal('stampModal')" class="w-1/2 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs">閉じる</button>
        <button onclick="submitQuiz()" class="w-1/2 py-2 bg-amber-500 hover:bg-amber-600 font-bold rounded-xl text-xs text-slate-950">送信する</button>
      </div>
    </div>
  </div>

  <!-- モーダル：管理者編集画面 -->
  <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass max-w-sm w-full p-5 rounded-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 class="font-bold text-base text-slate-100 flex items-center justify-between">
        <span>🔑 編集者・管理者画面</span>
        <button onclick="closeModal('adminModal')" class="text-slate-400 text-sm">&times;</button>
      </h3>

      <!-- 1. 問題の更新 -->
      <div class="space-y-2 border-t border-slate-700/50 pt-3">
        <label class="text-xs text-slate-400 font-semibold">秘密の質問・正解の更新</label>
        <select id="adminEventSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200"></select>
        <input type="text" id="adminQuestionInput" placeholder="新しい質問文" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200">
        <input type="text" id="adminAnswerInput" placeholder="新しい正解コード" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200">
        <button onclick="saveQuestion()" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold">質問を更新する</button>
      </div>

      <!-- 2. 手動スタンプ付与 -->
      <div class="space-y-2 border-t border-slate-700/50 pt-3">
        <label class="text-xs text-slate-400 font-semibold">代理スタンプ押印</label>
        <input type="text" id="manualUserName" placeholder="参加者の名前" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200">
        <button onclick="giveManualStamp()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold">スタンプを押してあげる</button>
      </div>

      <!-- 3. 集計ダッシュボード -->
      <div class="space-y-2 border-t border-slate-700/50 pt-3 text-xs">
        <label class="text-xs text-slate-400 font-semibold">参加状況ダッシュボード</label>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700">
            <div class="text-slate-400 text-[10px]">総予約数</div>
            <div id="dashBookings" class="font-bold text-amber-400 text-sm">--</div>
          </div>
          <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700">
            <div class="text-slate-400 text-[10px]">総スタンプ</div>
            <div id="dashStamps" class="font-bold text-amber-400 text-sm">--</div>
          </div>
          <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-700">
            <div class="text-slate-400 text-[10px]">コンプリート</div>
            <div id="dashCompleters" class="font-bold text-amber-400 text-sm">--</div>
          </div>
        </div>
        <button onclick="loadDashboard()" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs">最新データを集計</button>
      </div>
    </div>
  </div>

  <script>
    // --- 設定項目 ---
    const LIFF_ID = "2011577734-Ymuphm2J";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzxmuyRq6yNirwKO41B9y6Ly65v7Lv5fQ1gPV_8qG7bpPHRNBJsvPw1VhBCdD1BS80lcA/exec";

    // --- ローカルのフォールバックデータ ---
    let masterEvents = {
      "alice": {
        name: "① アリス",
        question: "アリスが飲むとおおきくなる飲み物は？",
        answer: "1111",
        dates: ["10/10 19:00", "10/12 14:00"]
      },
      "tron": {
        name: "② トロン",
        question: "グリッドの世界のバイクは？",
        answer: "1111",
        dates: ["10/24 20:00"]
      }
    };

    let currentUser = { userId: "guest_" + Math.random().toString(36).substring(2, 9), displayName: "ゲスト" };
    let userBookings = {}; 
    let userStamps = [];
    let activeTargetEventId = null;
    let tempSelectedDate = null;

    // --- 日程選択モーダルの補助関数 ---
    function renderDateOptions() {
      if (!activeTargetEventId || !masterEvents[activeTargetEventId]) return;
      const ev = masterEvents[activeTargetEventId];
      const container = document.getElementById("dateOptions");
      container.innerHTML = "";

      if (!ev.dates || ev.dates.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center">調整中のため選択できる日程がありません</p>`;
        return;
      }

      ev.dates.forEach(dateStr => {
        const isSelected = tempSelectedDate === dateStr;
        const isCurrentBooking = userBookings[activeTargetEventId] === dateStr;

        let btnClass = "bg-slate-800 border-transparent text-slate-200";
        if (isSelected) {
          btnClass = "bg-indigo-600 border-indigo-400 text-white font-bold ring-2 ring-indigo-400/50";
        }

        container.innerHTML += `
          <button onclick="selectDateTemp('${dateStr}')" class="w-full text-left py-2.5 px-4 border rounded-xl text-xs font-semibold flex justify-between items-center transition ${btnClass}">
            <span>🗓️ ${dateStr} ${isCurrentBooking ? '<span class="text-[10px] text-amber-300 ml-1">(現在の予約)</span>' : ''}</span>
            ${isSelected ? '<i class="fas fa-check text-amber-300"></i>' : '<i class="far fa-circle text-slate-500"></i>'}
          </button>
        `;
      });
    }

    function selectDateTemp(dateStr) {
      tempSelectedDate = dateStr;
      renderDateOptions();
      updateConfirmButton();
    }

    function updateConfirmButton() {
      const btn = document.getElementById("confirmBookingBtn");
      if (tempSelectedDate) {
        btn.disabled = false;
        btn.className = "w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-600/30 transition cursor-pointer";
        btn.textContent = `「${tempSelectedDate}」で予約確定する`;
      } else {
        btn.disabled = true;
        btn.className = "w-full py-2.5 bg-slate-700 text-slate-500 font-bold rounded-xl text-xs transition cursor-not-allowed";
        btn.textContent = "日程を選択してください";
      }
    }

    // --- LIFF初期化 ---
    window.onload = function() {
      if (typeof liff !== "undefined" && LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID") {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(profile => {
                currentUser.userId = profile.userId;
                currentUser.displayName = profile.displayName;
                document.getElementById('userName').textContent = currentUser.displayName;
                if(profile.pictureUrl) {
                  document.getElementById('userAvatar').innerHTML = `<img src="${profile.pictureUrl}" class="w-full h-full rounded-full">`;
                }
                syncServer();
              }).catch(() => syncServer());
            } else {
              syncServer();
            }
          })
          .catch(err => {
            console.error("LIFF Error:", err);
            syncServer();
          });
      } else {
        syncServer();
      }
    };

    // --- サーバー（GAS）から状態を取得 ---
    function syncServer() {
      renderApp();

      if (!GAS_URL || GAS_URL.includes("YOUR_GAS_WEB_APP_URL")) return;

      const url = `${GAS_URL}?action=GET_STATUS&userId=${encodeURIComponent(currentUser.userId)}`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if(data && data.events && Object.keys(data.events).length > 0) {
            masterEvents = data.events;
          }
          if(data && data.userBookings) {
            if (Array.isArray(data.userBookings)) {
              data.userBookings.forEach(id => { userBookings[id] = userBookings[id] || "予約済"; });
            } else {
              userBookings = data.userBookings;
            }
          }
          if(data && data.userStamps) userStamps = data.userStamps;
          renderApp();
          updateAdminSelectOptions();
        })
        .catch(err => {
          console.error("GASデータ取得失敗:", err);
          renderApp();
          updateAdminSelectOptions();
        });
    }

    // --- 画面描画 ---
    function renderApp() {
      const eventKeys = Object.keys(masterEvents);

      // 1. スタンプカード
      const stampGrid = document.getElementById("stampGrid");
      stampGrid.innerHTML = "";

      eventKeys.forEach((key, index) => {
        const isStamped = userStamps.includes(key);
        const html = `
          <div class="stamp-slot ${isStamped ? 'active' : ''}">
            <span class="text-[10px] text-slate-500 absolute top-2 left-2">#0${index + 1}</span>
            ${isStamped 
              ? `<div class="stamp-mark"><i class="fas fa-check-circle"></i></div><span class="text-[10px] text-amber-400 font-bold mt-1">済</span>`
              : `<i class="fas fa-film text-slate-700 text-2xl"></i><span class="text-[10px] text-slate-500 mt-1">${masterEvents[key].name}</span>`
            }
          </div>
        `;
        stampGrid.innerHTML += html;
      });

      document.getElementById("stampCount").textContent = `${userStamps.length} / ${eventKeys.length}`;

      // 2. イベントリスト
      const eventList = document.getElementById("eventList");
      eventList.innerHTML = "";

      eventKeys.forEach(key => {
        const ev = masterEvents[key];
        const isBooked = !!userBookings[key];
        const isStamped = userStamps.includes(key);

        const html = `
          <div class="glass p-4 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-sm text-slate-100">${ev.name}</h3>
              <div class="flex gap-1">
                ${isBooked ? `<span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-semibold">✓ 予約済</span>` : ''}
                ${isStamped ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-semibold">スタンプ済</span>` : ''}
              </div>
            </div>

            <!-- リアクションボタン -->
            <div class="flex gap-2 text-xs">
              <button onclick="sendReaction('${key}', '❤️')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-700">❤️ 楽しみ</button>
              <button onclick="sendReaction('${key}', '🙌')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-700">🙌 行く！</button>
            </div>

            <!-- アクションボタン -->
            <div class="flex gap-2 pt-1">
              <button onclick="openBookingModal('${key}')" class="w-1/2 py-2 ${isBooked ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-indigo-600 hover:bg-indigo-500 text-white'} text-xs font-semibold rounded-xl transition">
                ${isBooked ? '予約日程を変更する' : '日程を選んで予約'}
              </button>
              <button onclick="openStampModal('${key}')" ${isStamped ? 'disabled' : ''} class="w-1/2 py-2 ${isStamped ? 'bg-slate-800/50 text-slate-500 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-slate-950'} text-xs font-bold rounded-xl transition">
                ${isStamped ? 'スタンプ獲得済み' : 'スタンプを押す 🎯'}
              </button>
            </div>
          </div>
        `;
        eventList.innerHTML += html;
      });
    }

    // --- モーダル操作 ---
    function openBookingModal(eventId) {
      activeTargetEventId = eventId;
      tempSelectedDate = null;
      const ev = masterEvents[eventId];
      document.getElementById("bookingTitle").textContent = `${ev.name} の予約`;
      
      const noticeEl = document.getElementById("currentBookingNotice");
      if (userBookings[eventId] && userBookings[eventId] !== "予約済") {
        noticeEl.textContent = `現在：${userBookings[eventId]}`;
        noticeEl.classList.remove("hidden");
      } else {
        noticeEl.classList.add("hidden");
      }

      renderDateOptions();
      updateConfirmButton();
      document.getElementById("bookingModal").classList.remove("hidden");
    }

    function openStampModal(eventId) {
      activeTargetEventId = eventId;
      const ev = masterEvents[eventId];
      document.getElementById("quizQuestion").textContent = `❓ 質問: ${ev.question}`;
      document.getElementById("quizAnswer").value = "";
      document.getElementById("stampModal").classList.remove("hidden");
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add("hidden");
    }

    // --- サーバー送信アクション（確定時） ---
    function submitBooking() {
      if (!tempSelectedDate) return;

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "BOOKING",
          userId: currentUser.userId,
          displayName: currentUser.displayName,
          eventId: activeTargetEventId,
          detail: tempSelectedDate
        })
      });

      userBookings[activeTargetEventId] = tempSelectedDate;
      closeModal("bookingModal");
      renderApp();
      alert(`「${tempSelectedDate}」で予約を確定しました！`);
    }

    function submitQuiz() {
      const answer = document.getElementById("quizAnswer").value;
      if (!answer) {
        alert("答えを入力してください！");
        return;
      }

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "CHECK_STAMP",
          userId: currentUser.userId,
          displayName: currentUser.displayName,
          eventId: activeTargetEventId,
          answer: answer
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "OK") {
          if (!userStamps.includes(activeTargetEventId)) {
            userStamps.push(activeTargetEventId);
          }
          closeModal("stampModal");
          renderApp();
          alert("🎉 正解！スタンプを獲得しました！");
        } else {
          alert("❌ 残念！答えが違います。");
        }
      })
      .catch(() => {
        if(answer === "1111") {
          if (!userStamps.includes(activeTargetEventId)) userStamps.push(activeTargetEventId);
          closeModal("stampModal");
          renderApp();
          alert("🎉 スタンプを獲得しました！");
        } else {
          alert("❌ 答えが違います！");
        }
      });
    }

    function sendReaction(eventId, emoji) {
      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "REACTION",
          userId: currentUser.userId,
          displayName: currentUser.displayName,
          eventId: eventId,
          detail: emoji
        })
      });
      alert(`リアクション 「${emoji}」 を送信しました！`);
    }

    // --- 管理者機能 ---
    function toggleAdminModal() {
      document.getElementById("adminModal").classList.toggle("hidden");
    }

    function updateAdminSelectOptions() {
      const select = document.getElementById("adminEventSelect");
      select.innerHTML = "";
      Object.keys(masterEvents).forEach(key => {
        select.innerHTML += `<option value="${key}">${masterEvents[key].name}</option>`;
      });
    }

    function saveQuestion() {
      const eventId = document.getElementById("adminEventSelect").value;
      const q = document.getElementById("adminQuestionInput").value;
      const a = document.getElementById("adminAnswerInput").value;

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "UPDATE_QUESTION",
          eventId: eventId,
          question: q,
          answer: a
        })
      });

      if (masterEvents[eventId]) {
        if(q) masterEvents[eventId].question = q;
        if(a) masterEvents[eventId].answer = a;
      }
      alert("質問を更新しました！");
      renderApp();
    }

    function giveManualStamp() {
      const targetName = document.getElementById("manualUserName").value;
      const eventId = document.getElementById("adminEventSelect").value;
      if (!targetName) {
        alert("名前を入力してください");
        return;
      }

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "MANUAL_STAMP",
          eventId: eventId,
          targetName: targetName
        })
      });
      alert(`${targetName} さんに手動スタンプを付与しました！`);
    }

    function loadDashboard() {
      fetch(`${GAS_URL}?action=GET_DASHBOARD`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("dashBookings").textContent = data.totalBookings || 0;
          document.getElementById("dashStamps").textContent = data.totalStamps || 0;
          document.getElementById("dashCompleters").textContent = data.completers || 0;
        })
        .catch(() => alert("集計データの取得に失敗しました"));
    }
  </script>
</body>
</html>
